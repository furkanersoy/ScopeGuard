name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ScopeGuard
        run: python -m pip install -e .

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate included examples
        run: scopeguard validate --spec examples/api/openapi.yaml --config examples/scenarios/local-demo.yaml
