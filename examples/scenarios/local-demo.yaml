version: 1
target:
  base_url: http://127.0.0.1:8000
  allowed_hosts:
    - 127.0.0.1
  allow_remote: false
  max_requests: 10
  timeout_seconds: 5
  follow_redirects: false

identities:
  anonymous:
    auth: none
  user_a:
    auth: bearer
    token_env: SG_USER_A_TOKEN
  user_b:
    auth: bearer
    token_env: SG_USER_B_TOKEN

# These are the identity/endpoint pairs this demo expects to keep covered.
# Add only pairs that are part of the API's intended access policy.
coverage:
  required:
    - identity: anonymous
      operation: GET /health
    - identity: anonymous
      operation: GET /records/{record_id}
    - identity: user_a
      operation: GET /records/{record_id}
    - identity: user_b
      operation: GET /records/{record_id}
    - identity: user_b
      operation: GET /vulnerable/records/{record_id}

checks:
  - id: anonymous-health-check
    operation: GET /health
    identity: anonymous
    path: {}
    expected_status: [200]

  - id: anonymous-cannot-read-record
    operation: GET /records/{record_id}
    identity: anonymous
    path:
      record_id: record-a
    expected_status: [401]

  - id: user-a-reads-own-record
    operation: GET /records/{record_id}
    identity: user_a
    path:
      record_id: record-a
    expected_status: [200]
    assert_json:
      - pointer: /owner
        equals: user-a

  - id: user-a-cannot-read-user-b-record
    operation: GET /records/{record_id}
    identity: user_a
    path:
      record_id: record-b
    expected_status: [404]
    assert_json:
      - pointer: /owner
        not_equals: user-b

  - id: user-b-reads-own-record
    operation: GET /records/{record_id}
    identity: user_b
    path:
      record_id: record-b
    expected_status: [200]
    assert_json:
      - pointer: /owner
        equals: user-b

  - id: user-b-cannot-read-user-a-record
    operation: GET /records/{record_id}
    identity: user_b
    path:
      record_id: record-a
    expected_status: [404]
    assert_json:
      - pointer: /owner
        not_equals: user-a

  - id: vulnerable-route-should-deny-cross-user-read
    operation: GET /vulnerable/records/{record_id}
    identity: user_b
    path:
      record_id: record-a
    expected_status: [404]
    assert_json:
      - pointer: /owner
        not_equals: user-a
