name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and validate package distributions
        run: |
          python -m pip install --disable-pip-version-check --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install ScopeGuard from the built wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Gate high severity source findings
        run: scopeguard inspect --path src --checks secrets python --fail-on high --output "$RUNNER_TEMP/scopeguard-inspect.json"

      - name: Smoke-test installed CLI
        run: |
          scopeguard --version
          printf 'version\nexit\n' | scopeguard

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate included examples
        run: scopeguard validate --spec examples/api/openapi.yaml --config examples/scenarios/local-demo.yaml

      - name: Enforce required scenario coverage
        run: scopeguard coverage --strict --spec examples/api/openapi.yaml --config examples/scenarios/local-demo.yaml
