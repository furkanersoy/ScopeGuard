[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeguard"
version = "0.1.0"
description = "Local-first API authorization regression checks"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
scopeguard = "scopeguard.cli:main"
scopeguard-demo = "scopeguard_demo.server:main"

[tool.setuptools.packages.find]
where = ["src"]
